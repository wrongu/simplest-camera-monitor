---
cameras:
  - name: "MyCamera"
    url: !secret cam_url # RTSP URL of the camera stream
    port: !secret cam_port # RTSP port
    username: !secret cam_user # Username for camera authentication
    password: !secret cam_pass # Password for camera authentication
    resolution: [1280, 720] # Desired resolution for processing (width, height); options determined by the camera itself
    log_lifespan: 43200.0 # Lifespan of log entries in seconds (e.g., 43200 for 12 hours); older images will automatically be cleaned up to save space.
    detector_config: "path/to/mydetector.yaml"
    roi: "/media/mycamera/roi.png" # Optional path to a binary mask image defining the region of interest (white areas are processed, black areas are ignored)
    confidence_threshold: 0.5  # If a detector is attached to this camera,
media_root: "/media" # Images will be saved at <media_root>/<camera.name.lower()>/<YYYY>/<MM>/<DD>/<HHMMSS>.jpg
poll_frequency: 5.0 # Time in seconds between each poll of the camera stream for motion detection (e.g., 5.0 for every 5 seconds)

# Each class named here must be a class name in the detector(s). HomeAssistant will get an entity per camera per class
# named here.
watch_for_class: # List of object classes as strings to report back to HA. Only valid if there is a model file.
  - person

# --- Reporting to Home Assistant ------------------------------------------------------------
reporting: "mqtt" # or "rest" for the REST api or "none" for no callbacks (local debugging)
mqtt_publish_images: false # publish an annotated "last detection" image entity per camera. Only valid in mqtt mode.

# Extra config for MQTT. If running on Homeassistant, leave out 'host/port/username/password'. These will be auto
# discovered through the supervisor API.
# mqtt:
#   host: "localhost"
#   port: 1883
#   username: "mqtt_user"
#   password: "mqtt_pass"
#   base_topic: "camera_monitor"
#   discovery_prefix: "homeassistant"
